<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Logo variations</title>
<style>
    @font-face {
        font-family: 'Archivo';
        src: url('../../src-tauri/connect/archivo.woff2') format('woff2');
        font-weight: 100 900;
    }

    :root {
        --light: #fafaf5;
        --dark: #0d0d0d;
        --ink: #161616;
        --muted: #6b6658;
        --line: #dedbc9;
        --accent: #f03f06;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 2.5rem 1rem 4rem;
        background: #f2f1e7;
        color: var(--ink);
        font: 15px/1.45 'Archivo', ui-sans-serif, system-ui, sans-serif;
    }

    main { max-width: 72rem; margin: 0 auto; }

    h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 0.25rem; }
    h1 span { color: var(--accent); }
    .lead { color: var(--muted); margin: 0 0 2rem; }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 32rem), 1fr));
        gap: 1rem;
    }

    .card {
        background: var(--light);
        border: 1px solid var(--line);
        border-radius: 1.25rem;
        overflow: hidden;
    }

    .head { padding: 1rem 1.25rem 0.75rem; }
    .head h2 { display: flex; align-items: baseline; gap: 0.6rem; margin: 0; font-size: 1.15rem; font-weight: 700; }
    .head p { margin: 0.2rem 0 0; color: var(--muted); }

    .tag {
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 0.1rem 0.5rem;
        border-radius: 99px;
        background: #ffe5d4;
        color: #9e260e;
    }

    .tag.wild { background: var(--ink); color: #ff7a3d; }
    .tag.now { background: var(--line); color: var(--ink); }

    .stages { display: grid; grid-template-columns: 1fr 1fr; }

    .stage {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 1.5rem 1rem;
    }

    .stage.on-light { background: var(--light); border-top: 1px solid var(--line); }
    .stage.on-dark { background: var(--dark); }

    .big { width: 128px; height: 128px; }
    .small { display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
    .s32 { width: 32px; height: 32px; }
    .s16 { width: 16px; height: 16px; }

    /* MOCK BROWSER TAB | favicon in its real surroundings */
    .tab {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.35rem 0.6rem;
        border-radius: 0.5rem 0.5rem 0 0;
        font-size: 0.75rem;
        white-space: nowrap;
    }

    .on-light .tab { background: #e6e4d6; color: var(--ink); }
    .on-dark .tab { background: #232323; color: #f2f1e7; }

    @media (max-width: 30rem) {
        .stages { grid-template-columns: 1fr; }
        .big { width: 104px; height: 104px; }
    }
</style>
</head>
<body>
<main>
    <h1>notifica<span>·ex</span> logo variations</h1>
    <p class="lead">All candidates, mild to wild, each at 128 px, 32 px, 16 px and in a browser tab, on light and dark. Every one carries Tangerine (#ff5b19, or #f03f06 on light tiles).</p>

    <div class="grid" id="grid"></div>
</main>

    // Inlined so the page works without the files next to it
    for (const logo of logos) logo.file = 'data:image/svg+xml,' + encodeURIComponent(logo.svg);

    // One stage per background, same markup for both
    const stage = (logo, tone) => `
        <div class="stage on-${tone}">
            <img class="big" src="${logo.file}" alt="${logo.name} logo">
            <div class="small">
                <img class="s32" src="${logo.file}" alt="">
                <img class="s16" src="${logo.file}" alt="">
                <span class="tab"><img class="s16" src="${logo.file}" alt="">Notes</span>
            </div>
        </div>`;

    document.getElementById('grid').innerHTML = logos.map(logo => `
        <section class="card">
            <div class="head">
                <h2>${logo.name} <span class="tag ${logo.tag}">${logo.tag}</span></h2>
                <p>${logo.idea}</p>
            </div>
            <div class="stages">${stage(logo, 'light')}${stage(logo, 'dark')}</div>
        </section>`).join('');
</script>
