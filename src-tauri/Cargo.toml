[package]
name = "notifica-ex"
version = "0.4.2"
description = "Android shell around a self-hosted Notifica Ex server"
edition = "2024"

[lib]
name = "notifica_ex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
