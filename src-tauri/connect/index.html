<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<meta name="color-scheme" content="light dark" />
	<title>Notifica Ex</title>
	<style>
		/* TOKENS | copied from Platinum and Charcoal, this page loads before any server can hand them out */
		@font-face {
			font-family: 'Archivo Variable';
			src: url('archivo.woff2') format('woff2');
			font-weight: 100 900;
		}
		:root {
			--canvas: #f2f1e7;
			--raised: #ffffff;
			--ink: #161616;
			--ink-muted: color-mix(in oklab, #161616 62%, #f2f1e7);
			--line: color-mix(in oklab, #161616 20%, transparent);
			--accent: #f03f06;
			--on-accent: #fafaf5;
			--ease-out: cubic-bezier(0.16, 1, 0.3, 1);
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--canvas: #161616;
				--raised: #2c2c2b;
				--ink: #e5e3d2;
				--ink-muted: color-mix(in oklab, #e5e3d2 62%, #161616);
				--line: color-mix(in oklab, #e5e3d2 18%, transparent);
				--accent: #ff5b19;
				--on-accent: #0d0d0d;
			}
		}

		/* LAYOUT */
		* { box-sizing: border-box; }
		html, body { height: 100%; margin: 0; }
		body {
			display: grid;
			place-items: center;
			padding: env(safe-area-inset-top) 1.5rem env(safe-area-inset-bottom);
			background: var(--canvas);
			color: var(--ink);
			font: 400 1rem/1.4 'Archivo Variable', system-ui, sans-serif;
		}
		main {
			display: grid;
			justify-items: center;
			gap: 2rem;
			width: min(100%, 22rem);
		}
		.logo { width: 4.5rem; height: 4.5rem; }

		/* LOGO BREATHES WHILE THE SERVER IS ASKED */
		.waiting .logo { animation: breathe 1.4s ease-in-out infinite; }
		@keyframes breathe { 50% { opacity: 0.45; transform: scale(0.94); } }

		/* FORM | hidden until there is no server or it did not answer */
		form {
			display: grid;
			gap: 0.75rem;
			width: 100%;
			animation: rise 460ms var(--ease-out) both;
		}
		.waiting form { display: none; }
		@keyframes rise { from { opacity: 0; transform: translateY(0.75rem); } }
		label { font-size: 0.875rem; color: var(--ink-muted); padding-inline: 1rem; }
		input, button {
			height: 3rem;
			border-radius: 999px;
			font: inherit;
		}
		input {
			width: 100%;
			padding-inline: 1.25rem;
			border: 1px solid var(--line);
			background: var(--raised);
			color: var(--ink);
			outline: none;
			transition: border-color 160ms var(--ease-out);
		}
		input:focus { border-color: var(--accent); }
		button {
			border: 0;
			background: var(--accent);
			color: var(--on-accent);
			font-weight: 600;
			transition: transform 160ms var(--ease-out), opacity 160ms var(--ease-out);
		}
		button:active { transform: scale(0.97); }
		button:disabled { opacity: 0.5; }
		.status { min-height: 1.4em; margin: 0; padding-inline: 1rem; font-size: 0.875rem; color: var(--ink-muted); }
		.status.error { color: var(--accent); }

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
		}
	</style>
</head>
<body class="waiting">
	<main>
		<svg class="logo" viewBox="0 0 64 64" aria-label="Notifica Ex"><defs><g id="loop" fill="none" stroke="currentColor" stroke-width="6"><path d="M41.5 15.55A19 19 0 0 1 46.87 43.83M46.23 44.59A19 19 0 0 1 17.77 44.59M17.13 43.83A19 19 0 0 1 22.5 15.55"/><circle cx="41.5" cy="15.55" r="3" fill="currentColor" stroke="none"/><path d="M28.56 12.05L19.5 10.35L25.5 20.75Z" fill="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M25.5 32.5L30 37L38.5 27" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></defs><rect width="64" height="64" rx="15" fill="#ff5b19"/><use href="#loop" color="#7f230f" opacity=".45" transform="translate(1.8 1.4)" style="mix-blend-mode:multiply"/><use href="#loop" color="#161616" style="mix-blend-mode:multiply"/></svg>
		<form>
			<label for="server">Server</label>
			<!-- Text, not url: the url type rejects a bare host before withScheme() can add https -->
			<input id="server" type="text" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="notes.example.com" required />
			<button type="submit">Connect</button>
			<p class="status" role="status"></p>
		</form>
	</main>

	<script>
		const { invoke } = window.__TAURI__.core;
		const form = document.querySelector('form');
		const input = document.querySelector('input');
		const button = document.querySelector('button');
		const status = document.querySelector('.status');

		// Same rule as the app side, so the probe asks the address that gets saved
		const withScheme = (text) => text.includes('://') ? text : `https://${text}`;

		// REACHABLE CHECK | an opaque answer is enough, the page itself is not read
		async function reachable(url) {
			try {
				await fetch(url, { mode: 'no-cors', cache: 'no-store', signal: AbortSignal.timeout(8000) });
				return true;
			} catch {
				return false;
			}
		}

		// ====================================================================================================

		async function open(url) {
			status.className = 'status';
			status.textContent = 'Connecting…';
			button.disabled = true;

			if (await reachable(withScheme(url))) {
				try {
					await invoke('connect', { url });
					return;
				} catch (error) {
					status.textContent = String(error);
				}
			} else {
				status.textContent = `No answer from ${url}`;
			}

			status.className = 'status error';
			button.disabled = false;
			document.body.classList.remove('waiting');
		}

		form.addEventListener('submit', (event) => {
			event.preventDefault();
			open(input.value.trim());
		});

		// START | a saved server opens right away, the form only shows when there is none or it fails
		invoke('saved_server').then((saved) => {
			if (saved) input.value = saved;

			if (saved && !window.NotificaAndroid?.changingServer?.()) {
				open(saved);
			} else {
				document.body.classList.remove('waiting');
				input.focus();
			}
		}).catch((error) => {
			status.className = 'status error';
			status.textContent = String(error);
			document.body.classList.remove('waiting');
		});
	</script>
</body>
</html>
