Changelog: https://github.com/telefonsquid/notifica-ex/blob/master/CHANGELOG.md

Summary: Notes and reminders from your own notifica-ex server
Description: |-
  The Android app for a self hosted notifica-ex server. It opens your server,
  takes text and images shared from other apps into a new note and shows
  reminders in the background.

  Needs a running notifica-ex server and an account on it.
